[supervisord]
user=django
nodaemon=true

[program:django]
command=/opt/venv/bin/python manage.py runserver 0.0.0.0:8000
user=django
autorestart=true
priority=300

[program:redis]
command=redis-server /etc/redis/redis.conf
directory=/etc/redis
user=django
autorestart=true
stopsignal=QUIT
priority=100

[program:django-q]
command=/opt/venv/bin/python manage.py qcluster
user=django
autorestart=true
priority=200
