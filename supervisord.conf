[supervisord]
user=dj_user
nodaemon=true

[program:django]
command=/opt/venv/bin/python manage.py runserver 0.0.0.0:8000
user=dj_user
autorestart=true
priority=300

[program:redis]
command=redis-server /etc/redis/redis.conf
directory=/etc/redis
user=dj_user
autorestart=true
stopsignal=QUIT
priority=100

[program:django-q]
command=/opt/venv/bin/python manage.py qcluster
user=dj_user
autorestart=true
priority=200
