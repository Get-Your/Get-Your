[supervisord]
user=django
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:redis]
command=redis-server /etc/redis/redis.conf
directory=/var/lib/redis
user=django
autorestart=true
stopsignal=QUIT
priority=100
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:django-q]
command=uv run python /app/manage.py qcluster
user=django
autorestart=true
priority=200
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:django]
command=/start
user=django
autorestart=true
priority=300
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0