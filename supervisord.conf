[supervisord]
user=django
nodaemon=true

[program:django]
command=/start
user=django
autorestart=true
priority=300

[program:redis]
command=redis-server /etc/redis/redis.conf
directory=/etc/redis
user=django
autorestart=true
stopsignal=QUIT
priority=100

[program:django-q]
command=uv run python /app/manage.py qcluster
user=django
autorestart=true
priority=200
