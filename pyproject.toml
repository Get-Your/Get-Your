[project]
name = "Get-Your"
version = "8.0.0.dev0"
description = "Platform for Get-Your income-qualified program universal application"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "django~=5.2.19",
    "django-environ~=0.14.0",
    "django-json-widget~=2.1.1",
    "django-phonenumber-field[phonenumbers]~=9.0.0",
    "django-q2~=1.11.1",
    "django-redis~=7.0.0",
    "django-storages[azure]~=1.14.6",
    "gunicorn~=26.2.0",
    "hiredis~=3.5.0",
    "httpagentparser~=1.9.9",
    "pendulum~=3.3.0",
    "psycopg2-binary~=2.9.13",
    "python-magic~=0.4.27",
    "python-magic-bin~=0.4.14 ; (platform_machine == 'x86_64' and sys_platform == 'darwin') or sys_platform == 'win32'",
    "redis~=8.1.0",
    "sendgrid~=6.12.5",
    "tomlkit~=0.15.2",
    "twilio~=9.12.0",
    "urllib3~=2.8.0",
    "usaddress~=0.5.16",
    "whitenoise~=6.12.0",
]

[dependency-groups]
dev = [
    "pandas~=3.1.1",
    "rich~=15.0.0",
]
